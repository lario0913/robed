name: Update stats daily
on:
  schedule: [{ cron: '0 1 * * *' }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/update-stats.mjs
        env: { OPENSEA_API_KEY: '${{ secrets.OPENSEA_API_KEY }}' }
      - run: |
          git config user.name "stats-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/stats.json; git diff --cached --quiet || (git commit -m "Update stats" && git push)
